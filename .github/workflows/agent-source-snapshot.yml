name: Agent source snapshot

on:
  push:
    branches:
      - agent/frontend-semantic-consolidation

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: glorious-source
          path: .
          include-hidden-files: true
          retention-days: 1
