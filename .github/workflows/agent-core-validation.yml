name: Agent core validation

on:
  push:
    branches:
      - agent/semantic-header-representation

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/semantic-header-representation
      - name: Qualify option variants exactly once
        id: qualify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("self-host/src/frontend/headers/headers.glorious")
          source = path.read_text()
          source = source.replace("use Option::Some;\n", "")
          source = re.sub(r"(?<!Option::)\bSome\(", "Option::Some(", source)
          path.write_text(source)
          PY
          if git diff --quiet -- self-host/src/frontend/headers/headers.glorious; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit option qualification
        if: steps.qualify.outputs.changed == 'true'
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -- self-host/src/frontend/headers/headers.glorious
          git commit -m "Qualify semantic header option variants"
          git push origin HEAD:agent/semantic-header-representation
      - uses: dtolnay/rust-toolchain@stable
        if: steps.qualify.outputs.changed == 'false'
      - name: Compile the complete self-host test target
        if: steps.qualify.outputs.changed == 'false'
        run: cargo test -p grandiose --test self_host_bytecode --no-run
      - name: Exercise the complete self-host compiler
        if: steps.qualify.outputs.changed == 'false'
        run: cargo test -p grandiose --test self_host_bytecode -- --nocapture
