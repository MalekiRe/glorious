name: Agent core validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/semantic-header-representation
      - name: Separate arena bookkeeping from mutation
        id: repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("self-host/src/frontend/headers/headers.glorious")
          source = path.read_text()

          def replace_once(label, before, after):
              global source
              count = source.count(before)
              print(f"{label}: {count}")
              if count != 1:
                  raise SystemExit(f"{label} expected once, found {count}")
              source = source.replace(before, after, 1)

          replace_once(
              "fixity ordinal",
              "\n".join([
                  "            record_header(nominal, NominalHeader::Fixity(",
                  "                wrapping_convert_to_u32(Vec::len(&nominal.fixities.values) - 1)",
                  "            ));",
              ]),
              "\n".join([
                  "            let ordinal = wrapping_convert_to_u32(",
                  "                Vec::len(&nominal.fixities.values) - 1",
                  "            );",
                  "            record_header(nominal, NominalHeader::Fixity(ordinal));",
              ]),
          )
          for kind, arena in [
              ("Alias", "aliases"),
              ("Struct", "structs"),
              ("Enum", "enums"),
          ]:
              replace_once(
                  f"{kind.lower()} ordinal",
                  "\n".join([
                      f"        record_header(nominal, NominalHeader::{kind}(",
                      f"            wrapping_convert_to_u32(Vec::len(&nominal.{arena}.values) - 1)",
                      "        ));",
                  ]),
                  "\n".join([
                      "        let ordinal = wrapping_convert_to_u32(",
                      f"            Vec::len(&nominal.{arena}.values) - 1",
                      "        );",
                      f"        record_header(nominal, NominalHeader::{kind}(ordinal));",
                  ]),
              )

          replace_once(
              "struct range precompute",
              "\n".join([
                  "        try(parse_fields(value, &mut nominal.fields, start), @parse_struct);",
                  "        Vec::push(&mut nominal.structs.values, StructHeader {",
              ]),
              "\n".join([
                  "        try(parse_fields(value, &mut nominal.fields, start), @parse_struct);",
                  "        let field_end = Vec::len(&nominal.fields.values);",
                  "        let field_range = super::syntax::id_range(field_start, field_end);",
                  "        Vec::push(&mut nominal.structs.values, StructHeader {",
              ]),
          )
          replace_once(
              "struct range field",
              "\n".join([
                  "            fields: super::syntax::id_range(",
                  "                field_start,",
                  "                Vec::len(&nominal.fields.values)",
                  "            ),",
              ]),
              "            fields: field_range,",
          )

          replace_once(
              "variant range precompute",
              "\n".join([
                  "        append_edges(&mut value.output.type_edges, &fields, 0, 0);",
                  "        Vec::push(&mut variants.values, VariantHeader {",
              ]),
              "\n".join([
                  "        append_edges(&mut value.output.type_edges, &fields, 0, 0);",
                  "        let edge_end = Vec::len(&value.output.type_edges);",
                  "        let field_range = super::syntax::id_range(edge_start, edge_end);",
                  "        Vec::push(&mut variants.values, VariantHeader {",
              ]),
          )
          replace_once(
              "variant range field",
              "\n".join([
                  "            fields: super::syntax::id_range(",
                  "                edge_start,",
                  "                Vec::len(&value.output.type_edges)",
                  "            )",
              ]),
              "            fields: field_range",
          )

          replace_once(
              "enum range precompute",
              "\n".join([
                  "        try(parse_variants(&mut *value, &mut nominal.variants, start), @parse_enum);",
                  "        Vec::push(&mut nominal.enums.values, EnumHeader {",
              ]),
              "\n".join([
                  "        try(parse_variants(&mut *value, &mut nominal.variants, start), @parse_enum);",
                  "        let variant_end = Vec::len(&nominal.variants.values);",
                  "        let variant_range = super::syntax::id_range(variant_start, variant_end);",
                  "        Vec::push(&mut nominal.enums.values, EnumHeader {",
              ]),
          )
          replace_once(
              "enum range field",
              "\n".join([
                  "            variants: super::syntax::id_range(",
                  "                variant_start,",
                  "                Vec::len(&nominal.variants.values)",
                  "            ),",
              ]),
              "            variants: variant_range,",
          )

          path.write_text(source)
          PY
          if git diff --quiet -- self-host/src/frontend/headers/headers.glorious; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit separated arena bookkeeping
        if: steps.repair.outputs.changed == 'true'
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "agent@users.noreply.github.com"
          git add -- self-host/src/frontend/headers/headers.glorious
          git commit -m "Separate semantic header arena bookkeeping"
          git push origin HEAD:agent/semantic-header-representation
