name: CI

# Temporarily manual-only while the self-host parity campaign is in progress.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Self-host baseline audit
        run: tooling/self-host-stage0-audit.sh
      - name: Self-host progress dashboard
        run: tooling/self-host-stage0-status.sh
      - name: Self-host semantic-fallback audit
        run: tooling/self-host-semantic-fallback-audit.sh
      - name: Stage0 and VM
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          RUST_TEST_THREADS: "8"
        run: tooling/test-with-budget.sh tooling/ram-gate.sh cargo test --workspace --all-targets

  self-host-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Self-host source conformance
        run: tooling/test-with-budget.sh tooling/self-host-stage0-conformance.sh

  editor-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked extension dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - name: Validate VS Code manifest and package
        working-directory: editors/vscode
        run: |
          npm run validate
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist
          npm run package -- --out "dist/grandiose-$version.vsix"
          unzip -Z1 "dist/grandiose-$version.vsix" > dist/contents.txt
          grep -Fxq extension/extension.js dist/contents.txt
          grep -Fxq extension/syntaxes/grandiose.tmLanguage.json dist/contents.txt
          grep -Fxq extension/node_modules/vscode-languageclient/package.json dist/contents.txt
