name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage0 and VM
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          RUST_TEST_THREADS: "12"
        # The compiler job runs every GSC-2 test with its frozen source audit
        # and execution evidence. Do not execute that suite twice in CI.
        run: tooling/test-with-budget.sh tooling/ram-gate.sh cargo test --workspace --all-targets -- --skip gsc2

  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: GSC-2 source capabilities and contracts
        run: bash tooling/compiler-check.sh

  editor-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked extension dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - name: Validate VS Code manifest and package
        working-directory: editors/vscode
        run: |
          npm run validate
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist
          npm run package -- --out "dist/grandiose-$version.vsix"
          unzip -Z1 "dist/grandiose-$version.vsix" > dist/contents.txt
          grep -Fxq extension/extension.js dist/contents.txt
          grep -Fxq extension/syntaxes/grandiose.tmLanguage.json dist/contents.txt
          grep -Fxq extension/node_modules/vscode-languageclient/package.json dist/contents.txt
