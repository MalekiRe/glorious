name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Do not spend runner time validating commits that a newer push has replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Workspace formatting
        run: cargo fmt --all -- --check
      - name: Tooling formatting
        run: |
          cargo fmt --manifest-path tooling/fmt/Cargo.toml -- --check
          cargo fmt --manifest-path tooling/grand/Cargo.toml -- --check
          cargo fmt --manifest-path tooling/lsp/Cargo.toml -- --check

  compiler-and-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Compiler and VM
        run: cargo test --workspace --all-targets

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatter
            manifest: tooling/fmt/Cargo.toml
          - name: Build tool
            manifest: tooling/grand/Cargo.toml
          - name: Language server
            manifest: tooling/lsp/Cargo.toml
    name: tooling / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: ${{ matrix.name }}
        run: cargo test --manifest-path ${{ matrix.manifest }} --all-targets

  real-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build compiler, VM, and project tool
        run: |
          cargo build --release --workspace --bins
          cargo build --release --manifest-path tooling/grand/Cargo.toml --bin grand
      - name: Real grc-grand-grvm contract
        run: |
          integration_root="$(mktemp -d)"
          cd "$integration_root"
          "$GITHUB_WORKSPACE/tooling/grand/target/release/grand" new app
          cd app
          export GRAND_COMPILER="$GITHUB_WORKSPACE/target/release/grc"
          export GRAND_VM="$GITHUB_WORKSPACE/target/release/grvm"
          "$GITHUB_WORKSPACE/tooling/grand/target/release/grand" check
          "$GITHUB_WORKSPACE/tooling/grand/target/release/grand" build
          "$GITHUB_WORKSPACE/tooling/grand/target/release/grand" run
          test -f target/grand/app.grbc

  editor-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked extension dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - name: Validate VS Code manifest and package
        working-directory: editors/vscode
        run: |
          npm run validate
          version="$(node -p 'require("./package.json").version')"
          mkdir -p dist
          npm run package -- --out "dist/grandiose-$version.vsix"
          unzip -Z1 "dist/grandiose-$version.vsix" > dist/contents.txt
          grep -Fxq extension/extension.js dist/contents.txt
          grep -Fxq extension/syntaxes/grandiose.tmLanguage.json dist/contents.txt
          grep -Fxq extension/node_modules/vscode-languageclient/package.json dist/contents.txt
