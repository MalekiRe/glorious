name: Finalize specification consolidation

on:
  push:
    branches:
      - spec/consolidate-language-stdlib

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[spec-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/consolidate-language-stdlib
          fetch-depth: 0

      - name: Reconstruct and verify specifications
        shell: bash
        run: |
          set -euo pipefail
          cat .spec-staging/language/*.part | tr -d '\n' | base64 -d | bzip2 -d > glorious-language-specification.md
          cat .spec-staging/stdlib/*.part | tr -d '\n' | base64 -d | bzip2 -d > glorious-standard-library-specification.md
          echo "1947859ce4ddfc1ebe2106b947eb2c070774afce974b17d7ce608560711db06e  glorious-language-specification.md" | sha256sum -c -
          echo "3e4b77eda88d82b4234017dd3b96fcf999705f97cbf392c55cea73ab2bf7d847  glorious-standard-library-specification.md" | sha256sum -c -

      - name: Remove superseded specifications and update references
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            glorious-branded-environment-core-spec.md \
            docs/control-kernel.md \
            docs/conversions.md \
            docs/default-moves-and-closure-captures.md \
            docs/effect-syntax-redesign.md \
            docs/new-stdlib.md \
            docs/optional-label-unification.md \
            docs/std-lib.md

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          language = Path("glorious-language-specification.md")
          stdlib = Path("glorious-standard-library-specification.md")
          deleted = {
              Path("glorious-branded-environment-core-spec.md"),
              Path("docs/control-kernel.md"),
              Path("docs/conversions.md"),
              Path("docs/default-moves-and-closure-captures.md"),
              Path("docs/effect-syntax-redesign.md"),
              Path("docs/new-stdlib.md"),
              Path("docs/optional-label-unification.md"),
              Path("docs/std-lib.md"),
          }
          mapping = {
              "glorious-branded-environment-core-spec.md": language,
              "default-moves-and-closure-captures.md": language,
              "effect-syntax-redesign.md": language,
              "optional-label-unification.md": language,
              "std-lib.md": stdlib,
              "new-stdlib.md": stdlib,
              "control-kernel.md": stdlib,
              "conversions.md": stdlib,
          }

          inline_link = re.compile(r"(?P<prefix>\]\()(?P<target>[^)]+)(?P<suffix>\))")
          reference_link = re.compile(
              r"(?m)^(?P<prefix>\s*\[[^\]]+\]:\s*)(?P<target>\S+)(?P<suffix>.*)$"
          )

          def rewrite_target(path: Path, target: str) -> str:
              wrapper = ""
              stripped = target
              if stripped.startswith("<") and stripped.endswith(">"):
                  wrapper = "angle"
                  stripped = stripped[1:-1]
              if stripped.startswith(("http://", "https://", "mailto:", "#")):
                  return target
              path_part, separator, _anchor = stripped.partition("#")
              name = Path(path_part).name
              replacement = mapping.get(name)
              if replacement is None:
                  return target
              relative = os.path.relpath(replacement, path.parent).replace(os.sep, "/")
              return f"<{relative}>" if wrapper == "angle" else relative

          def rewrite_markdown(path: Path, text: str) -> str:
              def inline_repl(match: re.Match[str]) -> str:
                  raw = match.group("target")
                  # Preserve optional Markdown link titles.
                  pieces = raw.split(maxsplit=1)
                  target = rewrite_target(path, pieces[0])
                  if len(pieces) == 2:
                      target = f"{target} {pieces[1]}"
                  return f"{match.group('prefix')}{target}{match.group('suffix')}"

              def reference_repl(match: re.Match[str]) -> str:
                  target = rewrite_target(path, match.group("target"))
                  return f"{match.group('prefix')}{target}{match.group('suffix')}"

              text = inline_link.sub(inline_repl, text)
              return reference_link.sub(reference_repl, text)

          for path in Path(".").rglob("*.md"):
              if path in deleted or ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = rewrite_markdown(path, text)

              if path == Path("README.md"):
                  updated = updated.replace("# Grandiose\n", "# Glorious\n", 1)
                  updated = updated.replace(
                      "Grandiose is an experimental systems language",
                      "Glorious is an experimental systems language",
                      1,
                  )
                  updated = updated.replace(
                      "The fresh Glorious compiler is being implemented",
                      "The Grandiose compiler is being implemented",
                      1,
                  )
                  updated = updated.replace(
                      "Glorious LLVM backend",
                      "Grandiose LLVM backend",
                  )
                  updated = updated.replace(
                      "Grandiose generalizes affine and linear ownership with `Use<[lower, upper]>`.\n"
                      "The interval is part of the type's evidence:",
                      "Glorious exposes unrestricted, affine, and exact-linear ownership through `Use`.\n"
                      "The selected principal class is part of the type's evidence:",
                  )
                  updated = updated.replace(
                      "`Use<[1,1]>` means that a `Ticket` must be transferred or deconstructed exactly\n"
                      "once. `Use<[0,1]>` describes an affine value, `[0,infinity]` a conventionally\n"
                      "reusable value, and `[0,0]` a value that may be destroyed without being used.\n"
                      "The compiler tracks these quantities through branches, loops, calls, closures,\n"
                      "partial moves, cancellation, and continuation replay.",
                      "`Use<[1,1]>` means that a `Ticket` must be transferred or deconstructed exactly\n"
                      "once. `Use<[0,1]>` describes an affine value and `Use<[0,*]>` an unrestricted,\n"
                      "duplicable value. Grandiose tracks path-sensitive use intervals internally through\n"
                      "branches, loops, calls, closures, partial moves, cancellation, and continuation replay.",
                  )
                  updated = updated.replace(
                      "Grandiose supports terminal effects",
                      "Glorious supports terminal effects",
                  )
                  updated = updated.replace(
                      "[language core specification](glorious-language-specification.md)",
                      "[Glorious language specification](glorious-language-specification.md)",
                  )
                  updated = updated.replace(
                      "[standard-library contract](glorious-standard-library-specification.md)",
                      "[Glorious standard-library specification](glorious-standard-library-specification.md)",
                  )

                  distinction = (
                      "Grandiose is the compiler and toolchain implementation in this repository."
                  )
                  if distinction not in updated:
                      marker = "giving up higher-order functions, Rust-style borrowing, traits, or generics."
                      position = updated.find(marker)
                      if position != -1:
                          position += len(marker)
                          updated = updated[:position] + "\n\n" + distinction + updated[position:]

                  spec_section = "\n".join([
                      "## Normative specifications",
                      "",
                      "- [Glorious language specification](glorious-language-specification.md)",
                      "- [Glorious standard-library specification](glorious-standard-library-specification.md)",
                      "- [Grandiose self-hosted compiler specification](GSC-2-glorious-incremental-self-hosted-compiler-spec.md)",
                      "- [Grandiose bytecode specification](docs/bytecode.md)",
                      "",
                      "",
                  ])
                  if "## Normative specifications" not in updated:
                      marker = "## What makes the language different?\n"
                      updated = updated.replace(marker, spec_section + marker, 1)

                  # Canonical callable declarations use `fn`.
                  updated = updated.replace(
                      "redeem(ticket: Ticket) -> i64 {",
                      "fn redeem(ticket: Ticket) -> i64 {",
                  )
                  updated = updated.replace(
                      "answer() -> i64 {",
                      "fn answer() -> i64 {",
                  )

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

          rm -rf .spec-staging

      - name: Check the documentation update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          retired = {
              "glorious-branded-environment-core-spec.md",
              "control-kernel.md",
              "conversions.md",
              "default-moves-and-closure-captures.md",
              "effect-syntax-redesign.md",
              "new-stdlib.md",
              "optional-label-unification.md",
              "std-lib.md",
          }
          inline = re.compile(r"\]\(([^)]+)\)")
          reference = re.compile(r"(?m)^\s*\[[^\]]+\]:\s*(\S+)")
          failures = []

          for path in Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              targets = [match.group(1).split(maxsplit=1)[0] for match in inline.finditer(text)]
              targets += [match.group(1) for match in reference.finditer(text)]
              for target in targets:
                  target = target.strip("<>")
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if Path(target.partition("#")[0]).name in retired:
                      failures.append(f"{path}: {target}")

          if failures:
              print("Relative links to retired specifications remain:", file=sys.stderr)
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY
          test ! -e .spec-staging
          git diff --check

      - name: Commit consolidated specifications
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Glorious language specifications [spec-finalized]"
          git push origin HEAD:spec/consolidate-language-stdlib
