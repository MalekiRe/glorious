name: Expand snowflake compendium

on:
  push:
    branches:
      - docs/expand-synopsis-compendium-10k
    paths:
      - tools/expand-snowflake-compendium.mjs
      - .github/workflows/expand-snowflake-compendium.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Expand and validate the compendium
        run: node tools/expand-snowflake-compendium.mjs
      - name: Record generated document statistics
        run: |
          test "$(grep -c '^## [0-9][0-9]\. ' docs/self-hosted-compiler/00-snowflake-synopsis-compendium.md)" -eq 32
          test "$(grep -c '^# Volume ' docs/self-hosted-compiler/00-snowflake-synopsis-compendium.md)" -eq 8
          test "$(grep -c '<!-- BEGIN GENERATED EXPANSION' docs/self-hosted-compiler/00-snowflake-synopsis-compendium.md)" -eq 32
          test "$(wc -l < docs/self-hosted-compiler/00-snowflake-synopsis-compendium.md)" -ge 10000
          wc -l -w -c docs/self-hosted-compiler/00-snowflake-synopsis-compendium.md
      - name: Commit the expanded document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/self-hosted-compiler/00-snowflake-synopsis-compendium.md
          if git diff --cached --quiet; then
            echo "No document changes to commit"
            exit 0
          fi
          git commit -m "docs: expand compiler synopsis compendium"
          git push origin "HEAD:${GITHUB_REF_NAME}"
