[package]
name = "grandiose-vm"
version = "0.1.0"
edition = "2024"
description = "Portable verified bytecode VM for Grandiose"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "grvm"
path = "src/main.rs"

[dependencies]
grandiose-runtime = { path = "../grandiose-runtime" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
